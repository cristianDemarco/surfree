<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link href="popup.css" rel="stylesheet" />
  </head>
  <body>
    <div class="popup-card">
      <!-- Header / Main Switch -->
      <header class="header" id="main">
        <div class="brand">
          <img src="../images/surfree128.png" alt="Logo" class="logo" />
          <h1 class="title">SURFREE</h1>
        </div>
        <label class="switch" id="extensionSwitch">
          <input id="toggleExtension" type="checkbox" />
          <span class="slider round"></span>
        </label>
      </header>

      <!-- Whitelist Card -->
      <section class="whitelist-card">
        <div class="whitelist-info">
          <span class="whitelist-title">Whitelist sito corrente</span>
          <span class="whitelist-subtitle" id="domainSubtitle"
            >Pagina speciale</span
          >
        </div>
        <label class="switch" id="whitelistSwitch">
          <input id="toggleWhitelist" type="checkbox" />
          <span class="slider round"></span>
        </label>
      </section>

      <!-- Stats Grid (Popolata dinamicamente da JS) -->
      <div id="statsContainer"></div>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
